name: CI

# Three-stage pipeline modeled on Chef Automate:
#
#   verify  → fast checks on every commit (format, compile, tests)
#   build   → docker image + smoke test, runs on PRs and master pushes
#   deploy  → publish image to GHCR and cut a GitHub Release, master only
#
# Skipped stages (e.g. deploy on a PR) show as skipped in the Actions UI,
# not failed.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/convert-to-hex
  ELIXIR_VERSION: '1.18.3'
  OTP_VERSION: '27.3'

jobs:
  # ─────────────────────────── Stage 1: Verify ───────────────────────────
  # Runs on every push and PR. Fanned out into three named phases via a
  # matrix so they appear as child nodes under Verify in the Actions graph
  # view and run in parallel:
  #
  #   Lint    → mix format --check-formatted
  #   Syntax  → mix compile --warnings-as-errors
  #   Unit    → mix test
  #
  # Build/Deploy `needs: verify` waits for every phase to pass.
  verify:
    name: Verify · ${{ matrix.phase }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: Lint
            command: mix format --check-formatted
            needs_libvips: false
          - phase: Syntax
            command: mix compile --warnings-as-errors
            needs_libvips: false
          - phase: Unit
            command: mix test --color
            needs_libvips: true
    steps:
      - uses: actions/checkout@v6

      - name: Install libvips (Unit only — vix NIF needs it at runtime)
        if: matrix.needs_libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips42

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch deps
        run: mix deps.get

      - name: ${{ matrix.phase }}
        run: ${{ matrix.command }}

  # ─────────────────────────── Stage 2: Build ────────────────────────────
  # Three parallel phases — matches the Verify shape:
  #
  #   Security  → Trivy static scan of the built image (OS + dep CVEs)
  #   Quality   → Credo on the source
  #   Image     → docker build + end-to-end smoke test
  #
  # Doesn't publish — Deploy does that. The GHA layer cache means the
  # Security and Image phases share the same built layers and the second
  # one is mostly a cache restore.
  build:
    name: Build · ${{ matrix.phase }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: Security
            mode: docker
          - phase: Quality
            mode: elixir
          - phase: Image
            mode: docker
    steps:
      - uses: actions/checkout@v6

      # ── Docker-based phases (Security, Image) ──
      - if: matrix.mode == 'docker'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - if: matrix.mode == 'docker'
        name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: convert-to-hex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Elixir-based phase (Quality) ──
      - if: matrix.mode == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - if: matrix.mode == 'elixir'
        name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - if: matrix.mode == 'elixir'
        name: Fetch deps
        run: mix deps.get

      # ── Per-phase check ──
      # Report-only for now: log findings without blocking PRs. Day-zero
      # OS CVEs we can't fix shouldn't gate merges on a personal repo. The
      # report is still visible in the run log; tighten to exit-code: '1'
      # once a triage process exists.
      - if: matrix.phase == 'Security'
        name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: convert-to-hex:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - if: matrix.phase == 'Quality'
        name: Credo
        run: mix credo

      - if: matrix.phase == 'Image'
        name: Smoke test
        run: |
          mkdir -p tmp
          docker run --rm -v "${{ github.workspace }}:/work" convert-to-hex:ci \
            images/face.png tmp/face.svg --tile-size 40
          test -s tmp/face.svg
          head -1 tmp/face.svg | grep -q '<?xml'

  # ─────────────────────────── Stage 3: Deploy ───────────────────────────
  # Publishes the verified, built artifact. For a CLI tool this collapses
  # to "make available": push the image to GHCR under a semver tag and
  # :latest, and create a GitHub Release with usage instructions. Only
  # runs on push to master.
  #
  # Versioning: `@version` in mix.exs is the source of truth. To release,
  # bump it and merge to master. Re-merges without a version bump no-op
  # the publish steps (the version step zeroes its `tag` output and the
  # subsequent steps' `if:` short-circuits).
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve release tag from mix.exs
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oE '@version "[^"]+"' mix.exs | head -1 | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::Could not parse @version from mix.exs"
            exit 1
          fi
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists — skipping publish. Bump @version in mix.exs to ship a new release."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Releasing ${tag}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```

            ## Usage

            ```
            docker run --rm -v "$(pwd):/work" \
              ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
              input.png output.svg --tile-size 110
            ```
