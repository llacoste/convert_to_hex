name: Build and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/convert-to-hex

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: convert-to-hex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check formatting
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            --entrypoint mix convert-to-hex:ci \
            format --check-formatted

      - name: Compile (warnings as errors)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            --entrypoint mix convert-to-hex:ci \
            compile --warnings-as-errors

      - name: Run tests
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            --entrypoint mix convert-to-hex:ci \
            test --color

      - name: Smoke test on a real image
        run: |
          mkdir -p tmp
          docker run --rm -v "${{ github.workspace }}:/work" convert-to-hex:ci \
            legacy/images/face.png tmp/face.svg --tile-size 40
          test -s tmp/face.svg
          head -1 tmp/face.svg | grep -q '<?xml'

      - name: Compute release tag
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +'%Y.%m.%d')
          base="v${date}"
          count=$(gh release list --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName == \"${base}\" or (.tagName | startswith(\"${base}.\")))] | length")
          if [ "$count" -eq 0 ]; then
            tag="${base}"
          else
            tag="${base}.$((count + 1))"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Log in to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```

            ## Usage

            ```
            docker run --rm -v "$(pwd):/work" \
              ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
              input.png output.svg --tile-size 110
            ```
